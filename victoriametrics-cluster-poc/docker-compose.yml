services:

  # --- VICTORIAMETRICS CLUSTER ---
  vmstorage:
    image: victoriametrics/vmstorage:v1.94.0-cluster
    container_name: vmstorage
    ports:
      - "8482:8482"   # HTTP API
      - "8400:8400"   # vminsert ingestion port
      - "8401:8401"   # vmselect query port
    volumes:
      - vmdata:/storage
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=30d"
    networks:
      - monitoring

  vminsert:
    image: victoriametrics/vminsert:v1.94.0-cluster
    container_name: vminsert
    depends_on:
      - vmstorage
    ports:
      - "8480:8480"
    command:
      - "--storageNode=vmstorage:8400"
    networks:
      - monitoring

  vmselect:
    image: victoriametrics/vmselect:v1.94.0-cluster
    container_name: vmselect
    depends_on:
      - vmstorage
    ports:
      - "8481:8481"
    command:
      - "--storageNode=vmstorage:8401"
    networks:
      - monitoring

  vmagent:
    image: victoriametrics/vmagent:v1.94.0
    container_name: vmagent
    depends_on:
      - vminsert
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--remoteWrite.url=http://vminsert:8480/insert/0/prometheus/api/v1/write"
    networks:
      - monitoring

  # --- MICROSERVICOS & EXPORTERS ---
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://user:password@db:5432/app_db?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "15672:15672"  # Management UI
      - "15692:15692"  # Prometheus metrics
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
      - ./cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    command: >
      certonly
      --dns-cloudflare
      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
      -d monitor-poc.eazevedo.online
      --email admin@eazevedo.online
      --agree-tos
      --no-eff-email
      --non-interactive
    networks:
      - monitoring

  frontend:
    build:
      # FIX: context is now ./nginx so Dockerfile can COPY nginx.conf directly
      context: ./nginx
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Internal — nginx_status for nginx-exporter only
    volumes:
      # nginx.conf is now baked into the image; only cert and webroot are mounted
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    depends_on:
      - certbot
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    command:
      - "-nginx.scrape-uri=http://frontend:8080/nginx_status"
    depends_on:
      - frontend
    networks:
      - monitoring

  # --- VISUALIZACAO ---
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - vmselect
    networks:
      - monitoring

volumes:
  vmdata:

networks:
  monitoring:
    driver: bridge
