<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VictoriaMetrics PoC - Frontend</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            width: 90%;
            height: 90%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .header {
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #f8fafc;
            font-size: 1.5rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.025em;
        }
        .status-badge {
            padding: 6px 12px;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }
        .content {
            flex-grow: 1;
            padding: 0;
            margin: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .footer {
            padding: 15px 40px;
            font-size: 0.875rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.3);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VictoriaMetrics Monitoring Cluster</h1>
            <div class="status-badge">
                <span class="status-dot"></span>
                System Operational
            </div>
        </div>
        <div class="content">
            <!-- IFRAME_PLACEHOLDER -->
        </div>
        <div class="footer">
            VictoriaMetrics Cluster PoC Environment &copy; 2024
        </div>
    </div>
</body>
</html>
