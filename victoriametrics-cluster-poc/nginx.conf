server {
    listen 80;
    server_name monitor-poc.eazevedo.online;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot challenge location (if needed for HTTP-01, but we use DNS-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name monitor-poc.eazevedo.online;

    # SSL Certificate paths
    ssl_certificate /etc/letsencrypt/live/monitor-poc.eazevedo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor-poc.eazevedo.online/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /nginx_status {
        stub_status;
        allow all;
    }
}
