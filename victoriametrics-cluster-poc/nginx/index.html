<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <meta name="description" content="A unique and modern gallery featuring multiple image links.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --btn-red: #ef4444;
            --btn-red-hover: #dc2626;
            --btn-red-active: #b91c1c;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color));
            font-family: 'Outfit', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }

        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }

        .btn {
            appearance: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            color: white;
            background-color: var(--btn-red);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2), 0 2px 4px -1px rgba(239, 68, 68, 0.1);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            background-color: var(--btn-red-hover);
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4), 0 4px 6px -2px rgba(239, 68, 68, 0.2);
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:active {
            background-color: var(--btn-red-active);
            transform: translateY(1px);
        }

        /* Abstract shapes in background */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 20s infinite alternate;
        }
        
        .shape-1 {
            background: #991b1b;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            background: #4c1d95;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
            100% { transform: translate(-20px, 20px); }
        }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    
    <div class="container">
        <h1>Visual Gallery</h1>
        <p>Explore the stunning generated visuals by clicking the buttons below</p>
        
        <div class="button-grid">
            <a href="images/Gemini_Generated_Image_4xlvr14xlvr14xlv.png" target="_blank" class="btn">View Creation #1</a>
            <a href="images/Gemini_Generated_Image_c3hcfic3hcfic3hc.png" target="_blank" class="btn">View Creation #2</a>
            <a href="images/Gemini_Generated_Image_fvueezfvueezfvue.png" target="_blank" class="btn">View Creation #3</a>
            <a href="images/Gemini_Generated_Image_qag502qag502qag5.png" target="_blank" class="btn">View Creation #4</a>
            <a href="images/Gemini_Generated_Image_w64wqdw64wqdw64w.png" target="_blank" class="btn">View Creation #5</a>
            <a href="images/download.png" target="_blank" class="btn">View Download</a>
            <a href="https://www.youtube.com/watch?v=dKZAJixTvi4" target="_blank" class="btn">Playlist</a>
        </div>
    </div>
</body>
</html>
