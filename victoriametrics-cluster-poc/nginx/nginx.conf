# ── Port 80: HTTP → HTTPS redirect + ACME challenge ───────────────────────────
server {
    listen 80;
    server_name monitor-poc.eazevedo.online;

    # Let's Encrypt HTTP-01 (kept even though we use DNS-01, harmless)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: HTTPS public ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name monitor-poc.eazevedo.online;

    ssl_certificate     /etc/letsencrypt/live/monitor-poc.eazevedo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor-poc.eazevedo.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}

# ── Port 8080: internal metrics only (never exposed to internet) ──────────────
# nginx-exporter scrapes http://frontend:8080/nginx_status
server {
    listen 8080;
    server_name _;

    # Deny access from outside the Docker network
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    location /nginx_status {
        stub_status;
    }
}
